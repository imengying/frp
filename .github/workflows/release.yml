name: Release

# 打 tag 时构建并发布。
#
# 一个 tag（如 v1.0.0）对应**一个** release，标题为 "frp v1.0.0"，
# 里面同时包含服务端 frps 与客户端 frpc 的各平台包。
#
#   git tag -a v1.0.0 -m "frp v1.0.0" && git push origin v1.0.0
#
# 版本号一律取自触发本次运行的 tag，发布前会校验它与 Cargo.toml 一致，
# 保证 release 版本、二进制 `--version` 输出、tag 三者永远相同。
#
# 也可在 Actions 页面手动触发：只构建并上传 artifact，不创建 release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 解析版本号
  # ------------------------------------------------------------------
  prepare:
    name: 解析版本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
      number: ${{ steps.parse.outputs.number }}
      is_tag: ${{ steps.parse.outputs.is_tag }}
      notes: ${{ steps.parse.outputs.notes }}
    steps:
      - uses: actions/checkout@v7.0.1

      # tag 说 v1.0.0、二进制里却是别的版本，是最容易出的低级错误。
      # 这里直接挡住，避免发出去的包 `--version` 和 release 标题对不上。
      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag = $tag_version"
          echo "Cargo.toml = $cargo_version"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "::error::tag 版本($tag_version) 与 Cargo.toml 版本($cargo_version) 不一致，请先同步"
            exit 1
          fi

      - name: 解析
        id: parse
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="v0.0.0-dev"
            is_tag=false
          else
            version="${GITHUB_REF_NAME}"
            is_tag=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "number=${version#v}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${is_tag}" >> "$GITHUB_OUTPUT"

          # 从 CHANGELOG.md 取本版本的段落作为 release 说明。
          # 注意用 `/^## /` 精确匹配二级标题：若写成 `index($0,"##")==1`，
          # 三级标题（### 核心能力）也会命中并提前结束提取。
          notes=""
          if [[ -f CHANGELOG.md ]]; then
            notes=$(awk -v ver="${version#v}" '
              /^## / {
                if (found) exit
                if (index($0, ver) > 0) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md)
          fi
          if [[ -z "$notes" ]]; then
            notes="_本版本未在 CHANGELOG.md 中记录，详见提交历史。_"
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 构建矩阵：每个平台产出 frps 与 frpc 两个包
  # ------------------------------------------------------------------
  build:
    name: 构建 ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 这份列表必须与 ci.yml 的「打包冒烟测试」保持一致：
        # CI 会在每次推送时把每个目标都构建一遍，避免发布当天才发现某个
        # 目标编译不过（TLS 引入的 ring 是 C 代码，交叉编译需要额外工具链，
        # 只在 x86_64-gnu 上测会漏掉 musl）。
        include:
          # ---- x86_64 ----
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, native: true }
          # musl 静态链接：任何发行版通用，也是 Alpine + OpenRC 的主流选择
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, native: true }
          # ---- aarch64 ----
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu, native: false }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl, native: false }
          # ---- armv7 ----
          - { os: ubuntu-24.04, target: armv7-unknown-linux-musleabihf, native: false }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
        shell: bash

      # ring（TLS 的加密后端）含 C 代码，构建时需要对应目标的 C 工具链。
      # runner 自带 glibc 的 gcc，gnu 目标无需安装；musl 目标不能用 glibc
      # 的 gcc，需要 musl-gcc。交叉目标由 cross 的容器提供工具链。
      - name: 安装 C 工具链（musl 原生构建）
        if: matrix.native && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
        shell: bash

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: 安装 cross
        if: matrix.native == false
        run: cargo install cross --locked
        shell: bash

      - name: 配置 musl 链接器（原生）
        if: matrix.native && contains(matrix.target, 'musl')
        run: |
          # musl-gcc 同时充当编译器与链接器
          {
            echo "CC_${RUST_TARGET//-/_}=musl-gcc"
            echo "CARGO_TARGET_${RUST_TARGET^^}_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
        env:
          RUST_TARGET: ${{ matrix.target }}
        shell: bash

      - name: 构建（原生）
        if: matrix.native
        run: cargo build --release --locked --target ${{ matrix.target }}
        shell: bash

      - name: 构建（交叉）
        if: matrix.native == false
        run: cross build --release --locked --target ${{ matrix.target }}
        shell: bash

      # 打包逻辑在 scripts/package.sh，与 CI 的冒烟测试共用同一份
      - name: 打包 frps 与 frpc
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package.sh
          ./scripts/package.sh frps "${{ matrix.target }}" dist
          ./scripts/package.sh frpc "${{ matrix.target }}" dist
          echo "打包结果："
          ls -la dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0

  # ------------------------------------------------------------------
  # 发布：一个 release 同时包含两个组件
  # ------------------------------------------------------------------
  release:
    name: 发布
    needs: [prepare, build]
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 下载全部产物
        uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
          path: assets

      - name: 列出产物
        run: ls -la assets

      # 校验 release 会落在哪个 tag 上。
      # 不用 `git fetch --depth=1`：浅克隆下取 tag 容易失败，
      # 真正创建 release 的是下面那一步，这里只做记录与断言。
      - name: 确认 tag
        run: |
          set -euo pipefail
          echo "触发本次运行的 ref: ${GITHUB_REF}"
          echo "tag 名: ${GITHUB_REF_NAME}"
          case "${GITHUB_REF}" in
            refs/tags/*) echo "✅ 本次运行由 tag 触发，release 将创建在该 tag 上" ;;
            *) echo "::error::本次运行不是由 tag 触发（${GITHUB_REF}）"; exit 1 ;;
          esac
          # tag 名形如 v1.0.0，解析出的版本号必须与之吻合
          if [[ "v${{ needs.prepare.outputs.number }}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::解析出的版本与 tag 不一致"
            exit 1
          fi

      # 先删掉该 release 上已有的 asset。
      # action-gh-release 只覆盖同名文件，不会清理多余文件，
      # 重发同一个版本时旧的产物（比如被移除的 SHA256SUMS.txt）会残留下来。
      - name: 清理该 release 上的旧产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # release 不存在时会返回 404，属于正常情况（首次发布）
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [[ -z "$assets" ]]; then
            echo "该 release 暂无产物（或 release 尚不存在），无需清理"
            exit 0
          fi
          echo "$assets" | while read -r name; do
            [[ -z "$name" ]] && continue
            echo "删除旧产物: $name"
            gh release delete-asset "${GITHUB_REF_NAME}" "$name" --yes
          done

      - name: 创建 release
        uses: softprops/action-gh-release@v3.0.3
        with:
          # tag_name 用触发本次运行的 tag：release 版本 == 你打的 tag
          tag_name: ${{ github.ref_name }}
          name: frp ${{ needs.prepare.outputs.version }}
          files: assets/*
          # 产物一个都没匹配上就直接失败，别发一个空 release 出去
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ${{ needs.prepare.outputs.notes }}
          draft: false
          prerelease: false
