name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: 运行测试
        run: cargo test --workspace

  # 用与 release 完全相同的脚本与目标列表打一次包，确保发布流程不会在打 tag
  # 那天才炸。能拦住的问题：包里少了二进制或配置示例、两个组件的包互相混杂、
  # 打包脚本语法错误、解包目录残留、以及**某个发布目标根本编译不过**。
  #
  # 构建矩阵必须与 release.yml 保持一致：TLS 引入的 ring 是 C 代码，
  # 交叉编译需要额外工具链，只在 gnu 上测会漏掉 musl（曾因此发布失败）。
  package:
    name: 打包冒烟测试（${{ matrix.target }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, native: true }
          - { target: x86_64-unknown-linux-musl, native: true }
          - { target: aarch64-unknown-linux-gnu, native: false }
          - { target: aarch64-unknown-linux-musl, native: false }
          - { target: armv7-unknown-linux-musleabihf, native: false }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # ring（TLS 的加密后端）含 C 代码，构建时需要对应目标的 C 工具链。
      # runner 自带 glibc 的 gcc，所以 gnu 目标无需额外安装；
      # musl 目标不能用 glibc 的 gcc，需要 musl-gcc。
      # 交叉目标由 cross 的容器提供工具链，本机不用装。
      - name: 安装 C 工具链（musl 原生构建）
        if: matrix.native && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: 安装 cross
        if: matrix.native == false
        run: cargo install cross --locked

      - name: 配置 musl 链接器（原生）
        if: matrix.native == true && contains(matrix.target, 'musl')
        run: |
          # musl-gcc 同时充当编译器与链接器
          {
            echo "CC_${RUST_TARGET//-/_}=musl-gcc"
            echo "CARGO_TARGET_${RUST_TARGET^^}_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
        env:
          RUST_TARGET: ${{ matrix.target }}

      - name: 构建（原生）
        if: matrix.native == true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 构建（交叉）
        if: matrix.native == false
        run: cross build --release --locked --target ${{ matrix.target }}

      # 交叉目标的产物在本机跑不起来（架构不同），但配置校验需要能执行的
      # 二进制。用本机目标再构建一份，专门用来校验包内配置——配置是文本，
      # 与二进制架构无关。
      - name: 构建本机二进制（供交叉目标校验配置用）
        if: matrix.native == false
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: 打包两个组件
        run: |
          set -euo pipefail
          chmod +x scripts/package.sh
          ./scripts/package.sh frps ${{ matrix.target }} dist
          ./scripts/package.sh frpc ${{ matrix.target }} dist

      - name: 校验包内容
        env:
          # 交叉架构的包在本机跑不起来，用它来校验包内配置
          NATIVE_BIN: target/x86_64-unknown-linux-gnu/release
        run: |
          set -euo pipefail
          echo "== dist 内容 =="
          ls -la dist

          # 除了两个压缩包之外不能有别的文件（临时目录没清干净会让上传步骤出错）
          count=$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)
          [ "$count" -eq 2 ] || { echo "dist 下应为 2 个压缩包，实际 $count"; exit 1; }

          # 包名不带版本号，也不带 target 里的 unknown
          short_target="${{ matrix.target }}"
          short_target="${short_target//-unknown-/-}"

          chmod +x scripts/verify-package.sh
          if [ "${{ matrix.native }}" = "true" ]; then
            ./scripts/verify-package.sh "dist/frps_${short_target}.tar.gz" frps
            ./scripts/verify-package.sh "dist/frpc_${short_target}.tar.gz" frpc
          else
            ./scripts/verify-package.sh "dist/frps_${short_target}.tar.gz" frps "$NATIVE_BIN"
            ./scripts/verify-package.sh "dist/frpc_${short_target}.tar.gz" frpc "$NATIVE_BIN"
          fi

