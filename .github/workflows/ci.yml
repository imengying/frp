name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: 运行测试
        run: cargo test --workspace

  # 用与 release 完全相同的脚本与目标列表打一次包，确保发布流程不会在打 tag
  # 那天才炸。能拦住的问题：包里少了二进制或配置示例、两个组件的包互相混杂、
  # 打包脚本语法错误、解包目录残留、以及**某个发布目标根本编译不过**。
  #
  # 构建矩阵必须与 release.yml 保持一致：TLS 引入的 ring 是 C 代码，
  # 交叉编译需要额外工具链，只在 gnu 上测会漏掉 musl（曾因此发布失败）。
  package:
    name: 打包冒烟测试（${{ matrix.target }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, native: true }
          - { target: x86_64-unknown-linux-musl, native: true }
          - { target: aarch64-unknown-linux-gnu, native: false }
          - { target: aarch64-unknown-linux-musl, native: false }
          - { target: armv7-unknown-linux-musleabihf, native: false }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # ring（TLS 的加密后端）含 C 代码，构建时需要对应目标的 C 工具链。
      # runner 自带 glibc 的 gcc，所以 gnu 目标无需额外安装；
      # musl 目标不能用 glibc 的 gcc，需要 musl-gcc。
      # 交叉目标由 cross 的容器提供工具链，本机不用装。
      - name: 安装 C 工具链（musl 原生构建）
        if: matrix.native && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: 安装 cross
        if: matrix.native == false
        run: cargo install cross --locked

      - name: 配置 musl 链接器（原生）
        if: matrix.native == true && contains(matrix.target, 'musl')
        run: |
          # musl-gcc 同时充当编译器与链接器
          {
            echo "CC_${RUST_TARGET//-/_}=musl-gcc"
            echo "CARGO_TARGET_${RUST_TARGET^^}_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
        env:
          RUST_TARGET: ${{ matrix.target }}

      - name: 构建（原生）
        if: matrix.native == true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 构建（交叉）
        if: matrix.native == false
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: 打包两个组件
        run: |
          set -euo pipefail
          chmod +x scripts/package.sh
          ./scripts/package.sh frps ${{ matrix.target }} dist
          ./scripts/package.sh frpc ${{ matrix.target }} dist

      - name: 校验包内容
        run: |
          set -euo pipefail
          echo "== dist 内容 =="
          ls -la dist

          # 除了两个压缩包之外不能有别的文件（临时目录没清干净会让上传步骤出错）
          count=$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)
          [ "$count" -eq 2 ] || { echo "dist 下应为 2 个压缩包，实际 $count"; exit 1; }

          # 包名不带版本号，也不带 target 里的 unknown
          short_target="${{ matrix.target }}"
          short_target="${short_target//-unknown-/-}"
          frps_pkg="dist/frps_${short_target}.tar.gz"
          frpc_pkg="dist/frpc_${short_target}.tar.gz"
          [ -f "$frps_pkg" ] || { echo "缺少 $frps_pkg"; exit 1; }
          [ -f "$frpc_pkg" ] || { echo "缺少 $frpc_pkg"; exit 1; }

          check() {
            local pkg="$1" comp="$2"
            echo "== $pkg =="

            # 先把清单读进变量再用 grep 判断。
            # 不能写成 `tar tzf ... | grep -q`：grep -q 命中后立刻退出，
            # tar 收到 SIGPIPE 返回非 0，在 pipefail 下整条管道算失败，
            # 判断就永远不成立，校验会静默失效。
            local listing other
            listing=$(tar tzf "$pkg")
            echo "$listing"

            # 包里只有二进制与配套配置，且必须是平铺的（不能套一层目录），
            # 否则用户解压后还得再 cd 进去，也可能把上级目录搞乱。
            # 不能用 $'...' 拼字符串：那是 ANSI-C quoting，变量不会展开，
            # 比较会永远失败。
            local expected
            expected=$(printf '%s\n%s.toml' "$comp" "$comp")
            if [ "$listing" != "$expected" ]; then
              echo "$pkg 内容不合预期，应恰好是 ${comp} 与 ${comp}.toml 两个平铺文件"
              echo "实际："; printf '%s\n' "$listing"
              exit 1
            fi

            # 解压出来的二进制要能跑、配置要能用：
            # 二进制与同目录的 ${comp}.toml 直接配上就能启动
            local work
            work=$(mktemp -d)
            tar xzf "$pkg" -C "$work"
            [ -x "$work/${comp}" ] || { echo "解压后 ${comp} 没有可执行权限"; exit 1; }
            "$work/${comp}" --version >/dev/null || { echo "${comp} 无法运行"; exit 1; }
            "$work/${comp}" -c "$work/${comp}.toml" --check >/dev/null \
              || { echo "包内 ${comp}.toml 无法通过配置校验"; exit 1; }
            rm -rf "$work"
          }
          check "$frps_pkg" frps
          check "$frpc_pkg" frpc

          # musl 目标应当是静态链接——这是它相对 gnu 包的全部意义
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            echo "== 静态链接检查 =="
            file "target/${{ matrix.target }}/release/frps"
            if ! file "target/${{ matrix.target }}/release/frps" | grep -q "statically linked\|static-pie"; then
              echo "musl 目标应当静态链接，实际不是"; exit 1
            fi
          fi

          echo "打包冒烟测试通过（${{ matrix.target }}）"
