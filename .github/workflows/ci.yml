name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: 运行测试
        run: cargo test --workspace

  # 用与 release 完全相同的脚本与目标列表打一次包，确保发布流程不会在打 tag
  # 那天才炸。能拦住的问题：包里少了二进制或配置示例、两个组件的包互相混杂、
  # 打包脚本语法错误、解包目录残留、以及**某个发布目标根本编译不过**。
  #
  # 构建矩阵必须与 release.yml 保持一致：TLS 引入的 ring 是 C 代码，
  # 交叉编译需要额外工具链，只在 gnu 上测会漏掉 musl（曾因此发布失败）。
  package:
    name: 打包冒烟测试（${{ matrix.target }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, native: true }
          - { target: x86_64-unknown-linux-musl, native: true }
          - { target: aarch64-unknown-linux-gnu, native: false }
          - { target: aarch64-unknown-linux-musl, native: false }
          - { target: armv7-unknown-linux-musleabihf, native: false }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # ring 等含 C 代码的依赖需要对应目标的 C 工具链。
      # gnu 目标用系统的 gcc 即可；musl 目标需要 musl-gcc/musl 交叉编译器。
      - name: 安装 C 工具链
        run: |
          set -euo pipefail
          sudo apt-get update
          case "${{ matrix.target }}" in
            *musl*)
              if [ "${{ matrix.native }}" = "true" ]; then
                sudo apt-get install -y musl-tools
              else
                # 交叉编译 musl：cross 的容器里已备好工具链，这里只需本机 gcc
                sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
              fi
              ;;
            *)
              sudo apt-get install -y gcc
              ;;
          esac

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: 安装 cross
        if: matrix.native == false
        run: cargo install cross --locked

      - name: 配置 musl 链接器（原生）
        if: matrix.native == true && contains(matrix.target, 'musl')
        run: |
          # musl-gcc 同时充当编译器与链接器
          {
            echo "CC_${RUST_TARGET//-/_}=musl-gcc"
            echo "CARGO_TARGET_${RUST_TARGET^^}_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"
        env:
          RUST_TARGET: ${{ matrix.target }}

      - name: 构建（原生）
        if: matrix.native == true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 构建（交叉）
        if: matrix.native == false
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: 打包两个组件
        run: |
          set -euo pipefail
          chmod +x scripts/package.sh
          ./scripts/package.sh frps v0.0.0-ci ${{ matrix.target }} dist
          ./scripts/package.sh frpc v0.0.0-ci ${{ matrix.target }} dist

      - name: 校验包内容
        run: |
          set -euo pipefail
          echo "== dist 内容 =="
          ls -la dist

          # 除了两个压缩包之外不能有别的文件（解包目录残留会让发布步骤失败）
          count=$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)
          [ "$count" -eq 2 ] || { echo "dist 下应为 2 个压缩包，实际 $count"; exit 1; }

          frps_pkg="dist/frps_v0.0.0-ci_${{ matrix.target }}.tar.gz"
          frpc_pkg="dist/frpc_v0.0.0-ci_${{ matrix.target }}.tar.gz"
          [ -f "$frps_pkg" ] || { echo "缺少 $frps_pkg"; exit 1; }
          [ -f "$frpc_pkg" ] || { echo "缺少 $frpc_pkg"; exit 1; }

          check() {
            local pkg="$1" comp="$2"
            echo "== $pkg =="

            # 先把清单读进变量再用 grep 判断。
            # 不能写成 `tar tzf ... | grep -q`：grep -q 命中后立刻退出，
            # tar 收到 SIGPIPE 返回非 0，在 pipefail 下整条管道算失败，
            # 判断就永远不成立，校验会静默失效。
            local listing other
            listing=$(tar tzf "$pkg")
            echo "$listing"

            echo "$listing" | grep -q "/${comp}$" || { echo "缺少 $comp 二进制"; exit 1; }
            echo "$listing" | grep -q "/${comp}.toml.example" || { echo "缺少配置示例"; exit 1; }
            echo "$listing" | grep -q "/README.md" || { echo "缺少 README"; exit 1; }

            # 不能混进另一个组件的二进制
            other=frps; [ "$comp" = frps ] && other=frpc
            if echo "$listing" | grep -q "/${other}$"; then
              echo "$pkg 里混进了 $other"; exit 1
            fi
          }
          check "$frps_pkg" frps
          check "$frpc_pkg" frpc

          # musl 目标应当是静态链接——这是它相对 gnu 包的全部意义
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            echo "== 静态链接检查 =="
            file "target/${{ matrix.target }}/release/frps"
            if ! file "target/${{ matrix.target }}/release/frps" | grep -q "statically linked\|static-pie"; then
              echo "musl 目标应当静态链接，实际不是"; exit 1
            fi
          fi

          echo "打包冒烟测试通过（${{ matrix.target }}）"
